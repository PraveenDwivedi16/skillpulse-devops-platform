name: Production CI Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: production-ci
  cancel-in-progress: true

jobs:

  security-checks:
    name: DevSecOps Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build Scan Push Images
    runs-on: ubuntu-latest
    needs: security-checks

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/skillpulse-${{ matrix.service }}:latest \
            -t ${{ vars.DOCKERHUB_USERNAME }}/skillpulse-${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Push Docker Images
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/skillpulse-${{ matrix.service }}:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/skillpulse-${{ matrix.service }}:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/skillpulse-${{ matrix.service }}:latest
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deployment-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: CI Pipeline Status
        run: |
          echo "Production CI Pipeline Completed"
          echo "Docker images built and pushed successfully"
          echo "Security scans completed"
