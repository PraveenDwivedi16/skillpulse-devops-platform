name: Production Kubernetes CD

on:
  workflow_run:
    workflows:
      - Production CI Pipeline
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to K3s Cluster
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Starting Production Deployment"

            cd ~/skillpulse-devops-platform

            git pull origin main

            echo "Updating Kubernetes manifests"

            sed -i "s|image: .*/skillpulse-backend:.*|image: ${{ vars.DOCKERHUB_USERNAME }}/skillpulse-backend:${{ github.event.workflow_run.head_sha }}|" k8s/20-backend.yaml

            sed -i "s|image: .*/skillpulse-frontend:.*|image: ${{ vars.DOCKERHUB_USERNAME }}/skillpulse-frontend:${{ github.event.workflow_run.head_sha }}|" k8s/30-frontend.yaml

            echo "Applying Kubernetes manifests"

            kubectl apply -f k8s/

            echo "Restarting deployments"

            kubectl rollout restart deployment/backend -n skillpulse
            kubectl rollout restart deployment/frontend -n skillpulse

            echo "Waiting for successful rollout"

            kubectl rollout status deployment/backend -n skillpulse --timeout=180s
            kubectl rollout status deployment/frontend -n skillpulse --timeout=180s

            echo "Checking pod status"

            kubectl get pods -n skillpulse

            echo "Production deployment completed successfully"
